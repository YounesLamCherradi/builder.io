[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  functions = "netlify/functions"
  publish = "dist/spa"
  cache_dir = "/root/.local/share/pnpm/store"


[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
